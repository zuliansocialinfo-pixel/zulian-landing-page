<section class="contact-form"><h2>Raccontami cosa vuoi costruire.</h2><p>Nome, email e una descrizione del progetto sono sufficienti per iniziare. Non inserire documenti o informazioni sensibili.</p><form id="contact-form" novalidate><div class="field"><label for="contact-name">Nome</label><input id="contact-name" name="name" autocomplete="name" required minlength="2" maxlength="100" aria-describedby="contact-name-error"><span id="contact-name-error" class="field-error"></span></div><div class="field"><label for="contact-email">Email per la risposta</label><input id="contact-email" name="email" type="email" autocomplete="email" required maxlength="254" aria-describedby="contact-email-error"><span id="contact-email-error" class="field-error"></span></div><div class="field"><label for="contact-message">Cosa vuoi migliorare?</label><textarea id="contact-message" name="message" required minlength="20" maxlength="3000" rows="7" aria-describedby="contact-message-error"></textarea><span id="contact-message-error" class="field-error"></span></div><div class="contact-trap" aria-hidden="true"><label>Sito di conferma<input name="website" tabindex="-1" autocomplete="off"></label></div><div class="consent-line"><input id="contact-privacy" type="checkbox" required aria-describedby="contact-privacy-error"><label for="contact-privacy">Ho letto l’<a href="/privacy/">informativa privacy</a>. I dati servono a gestire questa richiesta.</label></div><span id="contact-privacy-error" class="field-error"></span><button class="btn primary" type="submit" id="contact-submit">Invia la richiesta</button><p id="contact-status" role="status" tabindex="-1"></p><noscript><p>Per inviare dal modulo è necessario JavaScript. Puoi usare i contatti diretti indicati in questa pagina.</p></noscript></form></section><script type="module" src="/assets/contact.js"></script>
